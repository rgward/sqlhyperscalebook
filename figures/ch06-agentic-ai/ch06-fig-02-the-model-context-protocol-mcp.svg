540 178C540 169.163 547.163 162 556 162Z" stroke="#0A2342" stroke-width="2.5" fill="#EAF3FB"/><text fill="#0A2342" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="30" transform="translate(607.07 202)">MCP</text><text fill="#33415C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="12.5" transform="translate(574.219 225)">Model Context Protocol</text><path d="M709 250C713.971 250 718 254.029 718 259L718 293C718 297.971 713.971 302 709 302L571 302C566.029 302 562 297.971 562 293L562 259C562 254.029 566.029 250 571 250Z" stroke="#1565C0" stroke-width="2" fill="#FFFFFF"/><text fill="#0D47A1" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="13.5" transform="translate(613.636 272)">discover</text><text fill="#33415C" font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(608.386 290)">tools/list</text><path d="M709 316C713.971 316 718 320.029 718 325L718 359C718 363.971 713.971 368 709 368L571 368C566.029 368 562 363.971 562 359L562 325C562 320.029 566.029 316 571 316Z" stroke="#2E7D32" stroke-width="2" fill="#FFFFFF"/><text fill="#1B5E20" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="13.5" transform="translate(615.508 338)">execute</text><text fill="#33415C" font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(608.386 356)">tools/call</text><text fill="#5A6B85" font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(602.063 404)">JSON-RPC 2.0</text><text fill="#5A6B85" font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(598.902 424)">HTTP or stdio</text><text fill="#33415C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(584.336 508)">one client · one server</text><path d="M282 259 538 272" stroke="#3C6088" stroke-width="2" fill="none"/><g clip-path="url(#clip1)"><path d="M524.322 265.298 538 272 523.714 277.282Z" fill="#3C6088"/></g><path d="M282 389 538 341" stroke="#3C6088" stroke-width="2" fill="none"/><g clip-path="url(#clip2)"><path d="M523.134 337.683 538 341 525.346 349.477Z" fill="#3C6088"/></g><path d="M282 519 538 410" stroke="#3C6088" stroke-width="2" fill="none"/><g clip-path="url(#clip3)"><path d="M522.768 409.964 538 410 527.469 421.005Z" fill="#3C6088"/></g><path d="M742 272 1018 216" stroke="#3C6088" stroke-width="2" fill="none"/><g clip-path="url(#clip4)"><path d="M1003.09 212.904 1018 216 1005.47 224.664Z" fill="#3C6088"/></g><path d="M742 341 1018 341" stroke="#3C6088" stroke-width="2" fill="none"/><g><path d="M1004 335 1018 341 1004 347Z" fill="#3C6088"/></g><path d="M742 410 1018 466" stroke="#3C6088" stroke-width="2" fill="none"/><g clip-path="url(#clip5)"><path d="M1005.47 457.336 1018 466 1003.09 469.096Z" fill="#3C6088"/></g><text fill="#5A6B85" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="13" transform="translate(1065.27 150)">TOOLS (MCP servers)</text><path d="M1228 175C1234.63 175 1240 180.373 1240 187L1240 245C1240 251.627 1234.63 257 1228 257L1032 257C1025.37 257 1020 251.627 1020 245L1020 187C1020 180.373 1025.37 175 1032 175Z" stroke="#E65100" stroke-width="2.5" fill="#FFF3E0"/><text fill="#BF360C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="15" transform="translate(1082.6 205)">SQL database</text><text fill="#33415C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(1065.05 226)">via DAB · SQL MCP Server</text><text fill="#8A5A2B" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="11" transform="translate(1051.54 245)">no model-written SQL (NL2DAB)</text><path d="M1228 300C1234.63 300 1240 305.373 1240 312L1240 370C1240 376.627 1234.63 382 1228 382L1032 382C1025.37 382 1020 376.627 1020 370L1020 312C1020 305.373 1025.37 300 1032 300Z" stroke="#869397" stroke-width="2" fill="#EEF2F7"/><text fill="#0A2342" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="15" transform="translate(1076.07 333)">REST / web API</text><text fill="#33415C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(1101.28 355)">MCP server</text><path d="M1228 425C1234.63 425 1240 430.373 1240 437L1240 495C1240 501.627 1234.63 507 1228 507L1032 507C1025.37 507 1020 501.627 1020 495L1020 437C1020 430.373 1025.37 425 1032 425Z" stroke="#869397" stroke-width="2" fill="#EEF2F7"/><text fill="#0A2342" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="15" transform="translate(1080.52 458)">Files / storage</text><text fill="#33415C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="11.5" transform="translate(1101.28 480)">MCP server</text><path d="M1228 556C1234.63 556 1240 561.373 1240 568L1240 664C1240 670.627 1234.63 676 1228 676L52 676C45.3726 676 40 670.627 40 664L40 568C40 561.373 45.3726 556 52 556Z" stroke="#9CC79C" stroke-width="1.5" fill="#EEF7EE"/><text fill="#1B5E20" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="700" font-size="15" transform="translate(60 584)">On connect, every MCP client (Copilot, Claude, ChatGPT, Cursor…) calls tools/list on each server → the Tools prompt is built by the protocol, not by hand.</text><text fill="#2C4A2C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="13.5" transform="translate(60 609)">Same three prompts — System + User + Tools — but now the Tools prompt is standard: each server publishes its own name, description + JSON schema.</text><text fill="#2C4A2C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="13.5" transform="translate(60 631)">Per prompt: the model picks a tool by its description → the client calls it (tools/call) → the server executes it → result to the model. M + N, not M × N.</text><text fill="#2C4A2C" font-family="Segoe UI,Segoe UI_MSFontService,sans-serif" font-weight="400" font-size="13.5" transform="translate(60 653)">Expose your database as an MCP server with DAB — every MCP host can discover and use it, no custom glue.</text></g></svg>