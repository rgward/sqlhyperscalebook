<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Arial, sans-serif">
  <!--
    Chapter 9: illustrative three-zone Hyperscale placement.

    Verified 2026-09-08 against:
      https://learn.microsoft.com/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
      https://learn.microsoft.com/azure/reliability/reliability-sql-database

    The placement is intentionally illustrative: Azure selects two or three
    zones and optimizes component placement. The figure preserves the documented
    relationships: compute replicas span zones; XLOG is zone-redundant; paired
    page servers for a data slice occupy different zones; data files and
    snapshots use zone-redundant Azure Storage.
  -->
  <defs>
    <marker id="mLogDown" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="90" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C0198C"/>
    </marker>
    <marker id="mLogUp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="270" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C0198C"/>
    </marker>
    <marker id="mDataDown" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="90" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0072C6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Region and zone frames -->
  <rect x="40" y="38" width="1200" height="620" rx="10" fill="#F8FBFD" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="60" y="66" font-size="14" font-weight="700" fill="#374151">Azure region</text>
  <text x="1220" y="66" text-anchor="end" font-size="10" font-style="italic" fill="#6B7280">Illustrative three-zone placement</text>

  <rect x="60" y="84" width="366" height="552" rx="8" fill="#FFFFFF" stroke="#B8C1CC" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="457" y="84" width="366" height="552" rx="8" fill="#FFFFFF" stroke="#B8C1CC" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="854" y="84" width="366" height="552" rx="8" fill="#FFFFFF" stroke="#B8C1CC" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="78" y="108" font-size="12" font-weight="700" fill="#4B5563">Availability zone 1</text>
  <text x="475" y="108" font-size="12" font-weight="700" fill="#4B5563">Availability zone 2</text>
  <text x="872" y="108" font-size="12" font-weight="700" fill="#4B5563">Availability zone 3</text>

  <!-- Compute replicas -->
  <rect x="92" y="132" width="302" height="104" rx="8" fill="#FFFFFF" stroke="#0072C6" stroke-width="2.2"/>
  <rect x="106" y="146" width="26" height="14" rx="3" fill="#0072C6"/>
  <text x="119" y="156.5" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">SQL</text>
  <text x="243" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#0072C6">Primary replica</text>
  <text x="243" y="185" text-anchor="middle" font-size="9.5" fill="#555555">read / write</text>
  <rect x="112" y="198" width="262" height="22" rx="5" fill="#EEF6FC" stroke="#0072C6" stroke-width="1"/>
  <text x="243" y="213" text-anchor="middle" font-size="9" font-weight="600" fill="#0072C6">Buffer pool + RBPEX</text>

  <rect x="489" y="132" width="302" height="104" rx="8" fill="#FFFFFF" stroke="#107C10" stroke-width="2.2"/>
  <rect x="503" y="146" width="26" height="14" rx="3" fill="#0072C6"/>
  <text x="516" y="156.5" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">SQL</text>
  <text x="640" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#107C10">HA secondary replica</text>
  <text x="640" y="185" text-anchor="middle" font-size="9.5" fill="#555555">automatic failover target</text>
  <rect x="509" y="198" width="262" height="22" rx="5" fill="#EFF7EF" stroke="#107C10" stroke-width="1"/>
  <text x="640" y="213" text-anchor="middle" font-size="9" font-weight="600" fill="#107C10">Buffer pool + RBPEX</text>

  <rect x="886" y="132" width="302" height="104" rx="8" fill="#FFFFFF" stroke="#107C10" stroke-width="2.2"/>
  <rect x="900" y="146" width="26" height="14" rx="3" fill="#0072C6"/>
  <text x="913" y="156.5" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">SQL</text>
  <text x="1037" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#107C10">HA secondary replica</text>
  <text x="1037" y="185" text-anchor="middle" font-size="9.5" fill="#555555">automatic failover target</text>
  <rect x="906" y="198" width="262" height="22" rx="5" fill="#EFF7EF" stroke="#107C10" stroke-width="1"/>
  <text x="1037" y="213" text-anchor="middle" font-size="9" font-weight="600" fill="#107C10">Buffer pool + RBPEX</text>

  <!-- One zone-redundant log service spans the deployment -->
  <rect x="78" y="276" width="1124" height="60" rx="9" fill="#FFF7ED" stroke="#D83B01" stroke-width="2"/>
  <text x="640" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#D83B01">Zone-redundant log service (XLOG)</text>
  <text x="640" y="320" text-anchor="middle" font-size="9.5" fill="#6B4A1F">synchronous log replication across availability zones</text>

  <path d="M243,236 L243,270" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogDown)"/>
  <path d="M640,270 L640,242" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogUp)"/>
  <path d="M1037,270 L1037,242" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogUp)"/>

  <!-- Paired page servers: each numbered data slice has a partner in another zone -->
  <text x="78" y="370" font-size="11" font-weight="700" fill="#0E6E63">Page servers</text>

  <rect x="92" y="388" width="142" height="82" rx="7" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="163" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E63">Page server 1</text>
  <rect x="106" y="428" width="114" height="24" rx="5" fill="#EEF8F6" stroke="#008575" stroke-width="1"/>
  <text x="163" y="444" text-anchor="middle" font-size="8.5" font-weight="600" fill="#008575">Dynamic RBPEX</text>

  <rect x="252" y="388" width="142" height="82" rx="7" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="323" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E63">Page server 2</text>
  <rect x="266" y="428" width="114" height="24" rx="5" fill="#EEF8F6" stroke="#008575" stroke-width="1"/>
  <text x="323" y="444" text-anchor="middle" font-size="8.5" font-weight="600" fill="#008575">Dynamic RBPEX</text>

  <rect x="489" y="388" width="142" height="82" rx="7" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="560" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E63">Page server 1</text>
  <rect x="503" y="428" width="114" height="24" rx="5" fill="#EEF8F6" stroke="#008575" stroke-width="1"/>
  <text x="560" y="444" text-anchor="middle" font-size="8.5" font-weight="600" fill="#008575">Dynamic RBPEX</text>

  <rect x="649" y="388" width="142" height="82" rx="7" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="720" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E63">Page server 3</text>
  <rect x="663" y="428" width="114" height="24" rx="5" fill="#EEF8F6" stroke="#008575" stroke-width="1"/>
  <text x="720" y="444" text-anchor="middle" font-size="8.5" font-weight="600" fill="#008575">Dynamic RBPEX</text>

  <rect x="886" y="388" width="142" height="82" rx="7" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="957" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E63">Page server 2</text>
  <rect x="900" y="428" width="114" height="24" rx="5" fill="#EEF8F6" stroke="#008575" stroke-width="1"/>
  <text x="957" y="444" text-anchor="middle" font-size="8.5" font-weight="600" fill="#008575">Dynamic RBPEX</text>

  <rect x="1046" y="388" width="142" height="82" rx="7" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="1117" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E63">Page server 3</text>
  <rect x="1060" y="428" width="114" height="24" rx="5" fill="#EEF8F6" stroke="#008575" stroke-width="1"/>
  <text x="1117" y="444" text-anchor="middle" font-size="8.5" font-weight="600" fill="#008575">Dynamic RBPEX</text>

  <path d="M243,336 L243,382" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogDown)"/>
  <path d="M640,336 L640,382" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogDown)"/>
  <path d="M1037,336 L1037,382" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogDown)"/>

  <!-- Durable storage is one zone-redundant tier, synchronized across all zones -->
  <rect x="78" y="518" width="1124" height="94" rx="9" fill="#F5F6F8" stroke="#5F6B7A" stroke-width="2"/>
  <text x="640" y="543" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">Zone-redundant Azure Storage</text>
  <text x="640" y="560" text-anchor="middle" font-size="9.5" fill="#6B7280">data files + snapshots synchronized across three availability zones</text>

  <path d="M183,574 V590 A60,8 0 0 0 303,590 V574" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.6"/>
  <ellipse cx="243" cy="574" rx="60" ry="8" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.6"/>
  <text x="243" y="591" text-anchor="middle" font-size="9" font-weight="600" fill="#4B5563">Data + snapshots</text>

  <path d="M580,574 V590 A60,8 0 0 0 700,590 V574" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.6"/>
  <ellipse cx="640" cy="574" rx="60" ry="8" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.6"/>
  <text x="640" y="591" text-anchor="middle" font-size="9" font-weight="600" fill="#4B5563">Data + snapshots</text>

  <path d="M977,574 V590 A60,8 0 0 0 1097,590 V574" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.6"/>
  <ellipse cx="1037" cy="574" rx="60" ry="8" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.6"/>
  <text x="1037" y="591" text-anchor="middle" font-size="9" font-weight="600" fill="#4B5563">Data + snapshots</text>

  <path d="M243,470 L243,512" fill="none" stroke="#0072C6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mDataDown)"/>
  <path d="M640,470 L640,512" fill="none" stroke="#0072C6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mDataDown)"/>
  <path d="M1037,470 L1037,512" fill="none" stroke="#0072C6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mDataDown)"/>

  <!-- Compact legend -->
  <line x1="60" y1="678" x2="1220" y2="678" stroke="#D1D5DB" stroke-width="1"/>
  <rect x="76" y="693" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#0072C6" stroke-width="2"/>
  <text x="102" y="704" font-size="10" fill="#374151">Primary</text>
  <rect x="180" y="693" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#107C10" stroke-width="2"/>
  <text x="206" y="704" font-size="10" fill="#374151">HA replica</text>
  <rect x="316" y="693" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#008575" stroke-width="2"/>
  <text x="342" y="704" font-size="10" fill="#374151">Page server</text>
  <path d="M474,700 L514,700" fill="none" stroke="#C0198C" stroke-width="2" marker-end="url(#mLogDown)"/>
  <text x="526" y="704" font-size="10" fill="#374151">Log pathway</text>
  <path d="M652,700 L692,700" fill="none" stroke="#0072C6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mDataDown)"/>
  <text x="704" y="704" font-size="10" fill="#374151">Durable I/O</text>
</svg>