<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Arial, sans-serif">
  <!-- ==================================================================== -->
  <!-- Figure 9-x. Failover group over Hyperscale geo-replication (Ch 9 §5) -->
  <!--                                                                      -->
  <!-- SCOPE: the management and routing layer a failover group adds over   -->
  <!-- active geo-replication. Regional XLOG and page-server internals live -->
  <!-- in ch09-figure-geo-replication.svg and are not repeated here.        -->
  <!--                                                                      -->
  <!-- Claims asserted here (Learn-verified 2026-09-08):                    -->
  <!--  * A failover group is a declarative abstraction over active         -->
  <!--    geo-replication and can contain all or a subset of databases.      -->
  <!--  * Its read-write listener follows the current primary; its read-only -->
  <!--    listener points to the current secondary.                          -->
  <!--  * Geo-failover switches every secondary database in the group to    -->
  <!--    the primary role, then DNS redirects the stable endpoints.        -->
  <!--  * Replication remains asynchronous and is configured per database.  -->
  <!--  * Hyperscale secondaries created through a failover group inherit   -->
  <!--    the corresponding primary database's HA / zone-redundancy setting. -->
  <!--                                                                      -->
  <!-- Sources (accessed 2026-09-08):                                      -->
  <!--   learn.microsoft.com/azure/azure-sql/database/                      -->
  <!--     failover-group-sql-db                                            -->
  <!--   learn.microsoft.com/azure/azure-sql/database/                      -->
  <!--     failover-group-configure-sql-db#locate-listener-endpoint         -->
  <!--   learn.microsoft.com/azure/reliability/reliability-sql-database     -->
  <!-- ==================================================================== -->
  <defs>
    <marker id="mUserDown" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="90" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="mUserLeft" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="180" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="mUserRight" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="0" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="mLogRight" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="0" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C0198C"/>
    </marker>
    <marker id="mCtlLeft" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="180" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#B15C00"/>
    </marker>
    <marker id="mCtlRight" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="0" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#B15C00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- ======================= APPLICATION TRAFFIC ======================= -->
  <rect x="180" y="32" width="210" height="54" rx="7" fill="#FFFFFF" stroke="#444444" stroke-width="2"/>
  <text x="285" y="55" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">Read-write workload</text>
  <text x="285" y="72" text-anchor="middle" font-size="9.5" fill="#666666">stable connection string</text>

  <rect x="890" y="32" width="210" height="54" rx="7" fill="#FFFFFF" stroke="#444444" stroke-width="2"/>
  <text x="995" y="55" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">Read-only workload</text>
  <text x="995" y="72" text-anchor="middle" font-size="9.5" fill="#666666">stable connection string</text>

  <!-- =========================== LISTENERS ============================= -->
  <rect x="100" y="116" width="370" height="70" rx="8" fill="#FFFFFF" stroke="#0072C6" stroke-width="2.2"/>
  <text x="285" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#0072C6">Read-write listener</text>
  <text x="285" y="163" text-anchor="middle" font-size="10" fill="#555555">DNS points to the current primary server</text>

  <rect x="810" y="116" width="370" height="70" rx="8" fill="#FFFFFF" stroke="#5C2D91" stroke-width="2.2"/>
  <text x="995" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#5C2D91">Read-only listener</text>
  <text x="995" y="163" text-anchor="middle" font-size="10" fill="#555555">DNS points to the current secondary server</text>

  <path d="M285,86 L285,114" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#mUserDown)"/>
  <path d="M995,86 L995,114" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#mUserDown)"/>

  <!-- ======================== FAILOVER GROUP =========================== -->
  <rect x="40" y="218" width="1200" height="454" rx="11" fill="#FCFCFD" stroke="#B15C00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="62" y="245" font-size="14" font-weight="700" fill="#B15C00">Failover group</text>
  <text x="62" y="264" font-size="9.5" fill="#6B7280">declarative management and routing over active geo-replication</text>

  <!-- policy panel -->
  <rect x="490" y="236" width="300" height="78" rx="8" fill="#FFFFFF" stroke="#B15C00" stroke-width="2"/>
  <text x="640" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#B15C00">Failover policy</text>
  <text x="640" y="280" text-anchor="middle" font-size="9.5" fill="#555555">customer-managed or Microsoft-managed</text>
  <text x="640" y="296" text-anchor="middle" font-size="9" fill="#6B7280">switches the database group as one unit</text>

  <!-- ============================ REGIONS ============================== -->
  <rect x="72" y="338" width="470" height="300" rx="9" fill="#F5F9FF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="92" y="365" font-size="13" font-weight="700" fill="#1F2937">Region A · current primary</text>
  <text x="92" y="383" font-size="9.5" fill="#6B7280">logical server A</text>

  <rect x="738" y="338" width="470" height="300" rx="9" fill="#FBF8FD" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="758" y="365" font-size="13" font-weight="700" fill="#1F2937">Region B · current secondary</text>
  <text x="758" y="383" font-size="9.5" fill="#6B7280">logical server B</text>

  <!-- primary database stack -->
  <rect x="126" y="424" width="360" height="154" rx="8" fill="#FFFFFF" stroke="#0072C6" stroke-width="1.4"/>
  <rect x="121" y="429" width="360" height="154" rx="8" fill="#FFFFFF" stroke="#0072C6" stroke-width="1.7"/>
  <rect x="116" y="434" width="360" height="154" rx="8" fill="#FFFFFF" stroke="#0072C6" stroke-width="2.4"/>
  <rect x="130" y="448" width="28" height="15" rx="3" fill="#0072C6"/>
  <text x="144" y="459" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">SQL</text>
  <text x="296" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#0072C6">Primary databases</text>
  <text x="296" y="493" text-anchor="middle" font-size="10" fill="#555555">all or a selected subset on the server</text>
  <text x="296" y="511" text-anchor="middle" font-size="10" fill="#555555">read / write</text>
  <rect x="148" y="532" width="296" height="32" rx="5" fill="#EEF6FC" stroke="#0072C6" stroke-width="1"/>
  <text x="296" y="546" text-anchor="middle" font-size="9" font-weight="600" fill="#0072C6">Hyperscale HA setting</text>
  <text x="296" y="558" text-anchor="middle" font-size="8.5" fill="#555555">zone redundant or not zone redundant</text>
  <text x="296" y="611" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">stack represents multiple databases</text>

  <!-- secondary database stack -->
  <rect x="792" y="424" width="360" height="154" rx="8" fill="#FFFFFF" stroke="#5C2D91" stroke-width="1.4"/>
  <rect x="787" y="429" width="360" height="154" rx="8" fill="#FFFFFF" stroke="#5C2D91" stroke-width="1.7"/>
  <rect x="782" y="434" width="360" height="154" rx="8" fill="#FFFFFF" stroke="#5C2D91" stroke-width="2.4"/>
  <rect x="796" y="448" width="28" height="15" rx="3" fill="#0072C6"/>
  <text x="810" y="459" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">SQL</text>
  <text x="962" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#5C2D91">Geo-secondary databases</text>
  <text x="962" y="493" text-anchor="middle" font-size="10" fill="#555555">one partner for each database in the group</text>
  <text x="962" y="511" text-anchor="middle" font-size="10" fill="#555555">read-only until geo-failover</text>
  <rect x="814" y="532" width="296" height="32" rx="5" fill="#F5EFF8" stroke="#5C2D91" stroke-width="1"/>
  <text x="962" y="546" text-anchor="middle" font-size="9" font-weight="600" fill="#5C2D91">Hyperscale HA setting inherited</text>
  <text x="962" y="558" text-anchor="middle" font-size="8.5" fill="#555555">when created through the failover group</text>
  <text x="962" y="611" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">separate regional storage for every database</text>

  <!-- per-database asynchronous geo-replication -->
  <path d="M476,500 L780,500" fill="none" stroke="#C0198C" stroke-width="3" marker-end="url(#mLogRight)"/>
  <text x="628" y="476" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C0198C">active geo-replication per database</text>
  <text x="628" y="491" text-anchor="middle" font-size="9" fill="#6B7280">asynchronous to commit</text>

  <!-- listeners route to roles, not fixed regions -->
  <path d="M100,151 L26,151 L26,414 L116,414 L116,432" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#mUserDown)"/>
  <text x="126" y="409" font-size="9" fill="#333333">routes to current primary</text>
  <path d="M1180,151 L1254,151 L1254,414 L1142,414 L1142,432" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#mUserDown)"/>
  <text x="1152" y="409" text-anchor="end" font-size="9" fill="#333333">routes to current secondary</text>

  <!-- policy controls role transition and listener redirection -->
  <path d="M490,276 L438,276 L438,336" fill="none" stroke="#B15C00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mCtlLeft)"/>
  <path d="M790,276 L842,276 L842,336" fill="none" stroke="#B15C00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mCtlRight)"/>
  <text x="640" y="329" text-anchor="middle" font-size="9" font-weight="600" fill="#B15C00">geo-failover reverses roles · listener DNS follows</text>
</svg>